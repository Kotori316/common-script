name: 'Release Prod Gradle'
on:
  workflow_call:
    inputs:
      sign_check_command:
        type: string
        required: false
        default: ''
      release_command:
        type: string
        required: true
      enable_signature_check:
        type: boolean
        default: false
      use_gradle_cache:
        type: boolean
        default: false
      java_version:
        type: string
        default: '17'
    secrets:
      GCP_IDENTITY_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT:
        required: true
      GCP_VERSION_FUNCTION_ENDPOINT:
        required: true
      GCP_FUNCTION_EXECUTION_ACCOUNT:
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISABLE_EXAMPLE: true
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: 'temurin'
          java-version: ${{inputs.java_version}}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: ${{!inputs.use_gradle_cache}}
          cache-read-only: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{secrets.GCP_IDENTITY_PROVIDER}}
          service_account: ${{secrets.GCP_SERVICE_ACCOUNT}}
      - name: Create Temporary Directory
        id: tmp-dir
        run: |
          TMP_DIR="$(mktemp -d)"
          echo "path=${TMP_DIR}" >> "$GITHUB_OUTPUT"
      - name: Download Private Key
        run: gcloud storage cp gs://kotori316-resources/secring.gpg "${SIGNING_SECRET_KEY_RING_FILE}"
        env:
          SIGNING_SECRET_KEY_RING_FILE: "${{ steps.tmp-dir.outputs.path }}/secring.gpg"
      - name: Download JKS
        run: gcloud storage cp gs://kotori316-resources/kotori316_keystore.jks "${SIGN_KEY_LOCATION}"
        env:
          SIGN_KEY_LOCATION: "${{ steps.tmp-dir.outputs.path }}/kotori316_keystore.jks"
      - name: Download Public Key
        run: |
          gcloud storage cp gs://kotori316-resources/pgp_public.pub "${PUBLIC_KEY_LOCATION}"
          gpg --import "${PUBLIC_KEY_LOCATION}"
        env:
          PUBLIC_KEY_LOCATION: "${{ steps.tmp-dir.outputs.path }}/pgp_public.pub"
      - name: Get credentials
        id: get-secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            key_id:kotori316-mods-resources/signing-key-id
            key_password:kotori316-mods-resources/signing-password
            jar_password:kotori316-mods-resources/jar-sign-key-password
            modrinth_token:kotori316-mods-resources/modrinth_token
            curseforge_token:kotori316-mods-resources/curseforge_token
            cloudflare_s3_endpoint:kotori316-mods-resources/cloudflare_s3_endpoint
            cloudflare_access_key:kotori316-mods-resources/cloudflare_access_key
            cloudflare_secret_key:kotori316-mods-resources/cloudflare_secret_key
            repolisite-publisher-name:kotori316-mods-resources/repolisite-publisher-name
            repolisite-publisher-password:kotori316-mods-resources/repolisite-publisher-password
      - run: chmod +x ./gradlew
      - name: Check build with sign arguments
        if: inputs.sign_check_command != ''
        run: >-
          ./gradlew
          -Psigning.secretKeyRingFile="${SIGNING_SECRET_KEY_RING_FILE}"
          -Psigning.password="${SIGNING_PASSWORD}"
          -Psigning.keyId="${SIGNING_KEY_ID}"
          -PjarSign.keyLocation="${SIGN_KEY_LOCATION}"
          -PjarSign.keyAlias="${SIGN_KEY_ALIAS}"
          -PjarSign.storePass="${SIGN_STORE_PASS}"
          ${{inputs.sign_check_command}}
        env:
          SIGNING_SECRET_KEY_RING_FILE: "${{ steps.tmp-dir.outputs.path }}/secring.gpg"
          SIGNING_KEY_ID: ${{steps.get-secrets.outputs.key_id}}
          SIGNING_PASSWORD: ${{steps.get-secrets.outputs.key_password}}
          SIGN_KEY_LOCATION: "${{ steps.tmp-dir.outputs.path }}/kotori316_keystore.jks"
          SIGN_KEY_ALIAS: "ko316"
          SIGN_STORE_PASS: ${{steps.get-secrets.outputs.jar_password}}
      - name: Verify
        if: inputs.sign_check_command != '' && inputs.enable_signature_check
        run: |
          find ./ -name "*.asc" | while IFS= read -r f; do
            echo "::group::Build ${f:0:-4}"
            gpg --verify "$f" "${f:0:-4}"
            echo "::endgroup::"
          done
          find . ! -name '*deobf.jar' ! -name '*sources.jar' ! -name '*common.jar' ! -name '*dev.jar' ! -path '*/common/*' -path '*/build/libs/*' -name '*.jar' | while IFS= read -r f; do
            echo "::group::Jar sign ${f}"
            jarsigner -verify -keystore "${SIGN_KEY_LOCATION}" "$f"
            echo "::endgroup::"
          done
          find ~/.m2 -name "*.asc" | while IFS= read -r f; do
            echo "::group::${f:0:-4}"
            echo "${f:0:-4}"
            gpg --verify "$f" "${f:0:-4}"
            echo "::endgroup::"
          done
        env:
          SIGN_KEY_LOCATION: "${{ steps.tmp-dir.outputs.path }}/kotori316_keystore.jks"
      - name: Release
        run: >-
          ./gradlew
          -Psigning.secretKeyRingFile="${SIGNING_SECRET_KEY_RING_FILE}"
          -Psigning.password="${SIGNING_PASSWORD}"
          -Psigning.keyId="${SIGNING_KEY_ID}"
          -PjarSign.keyLocation="${SIGN_KEY_LOCATION}"
          -PjarSign.keyAlias="${SIGN_KEY_ALIAS}"
          -PjarSign.storePass="${SIGN_STORE_PASS}"
          -Dorg.gradle.s3.endpoint="${CLOUDFLARE_S3_ENDPOINT}"
          ${{inputs.release_command}}
        env:
          RELEASE_DEBUG: false
          REPO_TOKEN: ${{secrets.GITHUB_TOKEN}}
          CURSE_TOKEN: ${{steps.get-secrets.outputs.curseforge_token}}
          MODRINTH_TOKEN: ${{steps.get-secrets.outputs.modrinth_token}}
          CLOUDFLARE_S3_ENDPOINT: ${{steps.get-secrets.outputs.cloudflare_s3_endpoint}}
          R2_ACCESS_KEY: ${{steps.get-secrets.outputs.cloudflare_access_key}}
          R2_SECRET_KEY: ${{steps.get-secrets.outputs.cloudflare_secret_key}}
          VERSION_FUNCTION_ENDPOINT: ${{ secrets.GCP_VERSION_FUNCTION_ENDPOINT }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_FUNCTION_EXECUTION_ACCOUNT }}
          MAVEN_USERNAME: ${{steps.get-secrets.outputs.repolisite-publisher-name}}
          MAVEN_PASSWORD: ${{steps.get-secrets.outputs.repolisite-publisher-password}}
          SIGNING_SECRET_KEY_RING_FILE: "${{ steps.tmp-dir.outputs.path }}/secring.gpg"
          SIGNING_KEY_ID: ${{steps.get-secrets.outputs.key_id}}
          SIGNING_PASSWORD: ${{steps.get-secrets.outputs.key_password}}
          SIGN_KEY_LOCATION: "${{ steps.tmp-dir.outputs.path }}/kotori316_keystore.jks"
          SIGN_KEY_ALIAS: "ko316"
          SIGN_STORE_PASS: ${{steps.get-secrets.outputs.jar_password}}
      - name: Verify Build Files
        if: inputs.enable_signature_check
        run: |
          find ./ -name "*.asc" | while IFS= read -r f; do
            echo "::group::${f:0:-4}"
            gpg --verify "$f" "${f:0:-4}"
            echo "::endgroup::"
          done
      - name: Verify Main Jar
        if: inputs.enable_signature_check
        run: |
          find . ! -name '*deobf.jar' ! -name '*sources.jar' ! -name '*common.jar' ! -name '*dev.jar' ! -path '*/common/*' -path '*/build/libs/*' -name '*.jar' | while IFS= read -r f; do
          echo "::group::Jar sign ${f}"
          jarsigner -verify -keystore "${SIGN_KEY_LOCATION}" "$f"
          echo "::endgroup::"
          done
        env:
          SIGN_KEY_LOCATION: "${{ steps.tmp-dir.outputs.path }}/kotori316_keystore.jks"
      - name: Verify Maven Local
        if: inputs.enable_signature_check
        run: |
          find ~/.m2 -name "*.asc" | while IFS= read -r f; do
            echo "::group::${f:0:-4}"
            gpg --verify "$f" "${f:0:-4}"
            echo "::endgroup::"
          done
      - name: Get repository name
        if: always()
        id: repo-name
        run:
          echo "repo-name=$(basename "$REPO")" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
      - name: Create Temporary Directory for build files
        id: build-files-tmp-dir
        run: |
          TMP_DIR="$(mktemp -d)"
          echo "path=${TMP_DIR}" >> "$GITHUB_OUTPUT"
      - name: Check main files
        id: main-files
        run: |
          find . ! -name '*deobf.jar' ! -name '*sources.jar' ! -name '*common.jar' ! -name '*dev.jar' ! -path '*/common/*' -path '*/build/libs/*' -name '*.jar' \
            -exec mv -t "${BUILD_FILES_TMP_DIR}" {} +
          ls "${BUILD_FILES_TMP_DIR}"
        env:
          BUILD_FILES_TMP_DIR: "${{ steps.build-files-tmp-dir.outputs.path }}"
      - name: Attestation
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: '${{ steps.build-files-tmp-dir.outputs.path }}/*'
          subject-name: ${{ steps.repo-name.outputs.repo-name }}-Release-${{ github.run_number }}
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.repo-name.outputs.repo-name }}-Release-${{ github.run_number }}
          retention-days: 7
          path: |
            **/build/*libs/
      - name: Upload maven
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.repo-name.outputs.repo-name }}-Maven-${{ github.run_number }}
          retention-days: 1
          # Required to upload files in ".m2" dir
          include-hidden-files: true
          path: ~/.m2
      - name: Cleanup Temporary Directory
        if: always()
        run: |
          rm -rf "${TMP_DIR}"
          rm -rf "${BUILD_FILES_TMP_DIR}"
        env:
          TMP_DIR: "${{ steps.tmp-dir.outputs.path }}"
          BUILD_FILES_TMP_DIR: "${{ steps.build-files-tmp-dir.outputs.path }}"
